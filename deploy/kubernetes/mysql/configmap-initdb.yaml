apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb
data:
  init.sql: |
    USE appdb;
    CREATE TABLE IF NOT EXISTS usuarios (
      id INT AUTO_INCREMENT PRIMARY KEY,
      nome VARCHAR(255),
      idade INT
    );
    GRANT ALL PRIVILEGES ON appdb.* TO 'app-user'@'%';
    FLUSH PRIVILEGES;
