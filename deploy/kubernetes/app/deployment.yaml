apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-web
    spec:
      containers:
        - name: app-web
          image: alissondrs/app-web:sha-REPLACE_ME
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-web-config
          env:
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-web-secrets
                  key: APP_PASSWORD
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 20
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
