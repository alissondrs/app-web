name: Build and publish image

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Optional application version tag (for example 1.0.5)
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: alissondrs/app-web

jobs:
  publish:
    name: Publish immutable Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop-sha-${{ github.sha }},enable=${{ github.ref_name == 'develop' }}
            type=raw,value=prod-sha-${{ github.sha }},enable=${{ github.ref_name == 'main' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Write deployment metadata
        run: |
          mkdir -p deployment-metadata
          {
            echo "image=${IMAGE_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "tags<<EOF"
            echo "${{ steps.meta.outputs.tags }}"
            echo "EOF"
          } > deployment-metadata/image.env
      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: image-metadata-${{ github.sha }}
          path: deployment-metadata/image.env
          retention-days: 7
