apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-web
  labels:
    app.kubernetes.io/name: app-web
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: app-web
    app.kubernetes.io/version: "1.0.4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app-web
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-web
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: app-web
        app.kubernetes.io/version: "1.0.4"
    spec:
      containers:
        - name: app-web
          image: alissondrs/app-web:1.0.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-web-config
          env:
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-web-secrets
                  key: APP_PASSWORD
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 20
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
