apiVersion: v1
kind: Service
metadata:
  name: app-web
  labels:
    app.kubernetes.io/name: app-web
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: app-web
spec:
  selector:
    app.kubernetes.io/name: app-web
    app.kubernetes.io/component: api
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
  type: ClusterIP
